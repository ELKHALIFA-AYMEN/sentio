name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: this workflow only checks code.
permissions:
  contents: read

# A new push on the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, type-check, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.10"
          enable-cache: true

      # Same commands as on a developer machine: see the Makefile.
      - name: Install dependencies (Python version from .python-version, versions from uv.lock)
        run: make install

      - name: Lint and type-check
        run: make lint

      - name: Run tests
        run: make test
