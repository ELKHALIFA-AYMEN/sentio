# Local stack for Sentio. Start it from the repository root with `make up` (or `docker compose up -d`).
# Every setting has a default, so the stack works without a .env file; see .env.example to override.
# Ports are bound to 127.0.0.1: the services are reachable from this machine only, not from the network.

name: sentio

services:
  # --- Message broker (Kafka-compatible) ----------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container # single node, settings suited to a laptop
      - --smp=1 # one CPU core
      - --memory=1G
      - --default-log-level=warn
      # Two listeners: one for containers (redpanda:9092), one for the host (localhost:19092).
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${REDPANDA_KAFKA_PORT:-19092}
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "127.0.0.1:${REDPANDA_KAFKA_PORT:-19092}:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot job: creates the topics, then exits.
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      RPK_BROKERS: redpanda:9092
      RPK_ADMIN_HOSTS: redpanda:9644
      TOPIC_PARTITIONS: ${TOPIC_PARTITIONS:-3}
      TOPIC_RETENTION_MS: ${TOPIC_RETENTION_MS:-86400000}
    volumes:
      - ./infra/redpanda/create-topics.sh:/scripts/create-topics.sh:ro
    restart: "no"

  # Web UI to browse topics and messages: http://localhost:8080
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.14.0
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "127.0.0.1:${REDPANDA_CONSOLE_PORT:-8080}:8080"

  # --- Database -----------------------------------------------------------------
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentio}
      POSTGRES_DB: ${POSTGRES_DB:-sentio}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  redpanda-data:
  postgres-data:
